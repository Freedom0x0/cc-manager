# Build CC Manager v4.0 installers on push tag or manual dispatch.
#
# v4.0 Tauri 2 migration: 重写 CI for cargo-tauri build + 双平台 (Windows + macOS)。
# v3.1 Electron workflow (build-installers.yml v1) 弃用 — 路径完全不适配 Tauri。
#
# - tag v*     → Windows + macOS 双 build, 产物挂 GitHub release
# - manual     → Actions 页面 Run workflow, 只 build 不发 release (调试用)
# - push PR    → 不触发 (避免每次 PR 5-10 分钟 mac build)
#
# Mac 产物未签名 (CLAUDE.md §13 D11 决策 v4 起步不签): Gatekeeper 首启拦 + 右键打开。
# v4.1+ 才接 Apple Developer ID + notarization。
#
# 镜像: .cargo/config.toml 已配 rsproxy-sparse (commit 0 落),节省 30-60min → 5-10min。
name: Build installers (Tauri 2)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release 创建/更新 release

jobs:
  # ───────────────────── Windows: test + build + upload ─────────────────────
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies (skip native compile)
        # CLAUDE.md §10 (v4.0): 唯一需要 native 编译的是 tauri (Rust),
        # 无 better-sqlite3 了 (rusqlite bundled)。npm ci 不需要 --ignore-scripts,
        # 但保留 skip-on-error 防 postinstall 失败(纯保险)。
        run: npm ci --ignore-scripts

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri → target

      - name: Run cargo test (lib)
        # v4.0 commit 11/12 已落 22 case + 2 ignore; Windows Defender 不再拦。
        run: npm run test:tauri -- --lib

      - name: Type check (renderer + electron config)
        # v4.0 仍用 tsc 验证 src/ 前端, electron config 留作历史(空壳)
        run: npm run typecheck

      - name: Build portable installer
        # cargo-tauri build → src-tauri/target/release/bundle/{nsis,msi}/*.exe
        run: npm run build:tauri

      - name: Upload Windows MSI/NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-manager-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload to GitHub release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────── macOS: test + build + upload (未签名) ─────────────────────
  macos:
    name: macOS installer (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri → target

      - name: Run cargo test (lib)
        run: npm run test:tauri -- --lib

      - name: Type check
        run: npm run typecheck

      - name: Build DMG + APP
        # cargo-tauri build → src-tauri/target/release/bundle/{dmg,macos}/*
        # 已知问题: GitHub Actions macos-latest (M1) cargo-tauri DMG 偶发挂起,
        # fallback retry 1 次。
        run: npm run build:tauri || (sleep 15 && echo "::warning::DMG build retry — known GitHub Actions macos-latest" && npm run build:tauri)

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cc-manager-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn   # macOS best-effort; 未签名 + 真机未验证

      - name: Upload to GitHub release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
