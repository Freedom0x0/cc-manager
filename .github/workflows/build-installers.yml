# Build CC Manager installers on push tag or manual dispatch.
#
# - tag v*   → 同时跑 Windows + macOS 双 build,把产物挂到 GitHub release
# - manual   → 在 Actions 页面点 "Run workflow",只 build 不发 release(供调试)
# - push PR  → 不触发(避免每次 PR 都跑 5-10 分钟的 mac build)
#
# Mac 产物未签名(CLAUDE.md §13 D11 决策):Gatekeeper 首启拦截 + 右键打开。
# v4.0 才会接 Apple Developer ID + notarization。
name: Build installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 允许 softprops/action-gh-release 创建/更新 release

jobs:
  # ───────────────────── Windows: build + test + upload ─────────────────────
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies (skip native compile)
        # CLAUDE.md §10:better-sqlite3 必须用 Electron headers 重编,
        # 不能用系统 Node 的预编译 .node(二进制 ABI 不兼容)。
        run: npm ci --ignore-scripts

      - name: Rebuild better-sqlite3 for Electron
        # electron-rebuild 把 better-sqlite3 编成跟 Electron 内置 Node ABI 匹配。
        # 没有这一步,npm test 会 ERR_DLOPEN_FAILED(NODE_MODULE_VERSION 127 vs 128)。
        run: npm run rebuild:sqlite

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build portable installer
        # electron-builder 自带 @electron/rebuild 会再次重编 better-sqlite3,
        # 这次按目标 Electron 版本,确保打包出来的 binary 可运行。
        run: npm run package:portable

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-manager-windows-portable
          path: release/CC Manager-*-portable.exe
          if-no-files-found: error

      - name: Upload to GitHub release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/CC Manager-*-portable.exe
            release/CC Manager-*-x64.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────── macOS: build + upload (未签名) ─────────────────────
  # macOS runner 是 Apple Silicon (M1,arm64)。electron-builder 配 mac target =
  # dmg+zip 双架构(arm64+x64),D9 续决策要求双架构。Apple Silicon 用户用 arm64
  # 原生跑,Intel Mac 用 Rosetta 2 跑 x64。
  #
  # 已知问题:GitHub Actions macos-latest 的 hdiutil detach 在 arm64 DMG 打包时
  # 偶发失败(Exit code 16)。fallback:DMG 失败仍继续产 ZIP(zip 没这个问题)。
  macos:
    name: macOS installer (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies (skip native compile)
        run: npm ci --ignore-scripts

      - name: Rebuild better-sqlite3 for Electron
        # CLAUDE.md §10:macOS 系统 Node ABI ≠ Electron Node ABI,需 electron-rebuild
        run: npm run rebuild:sqlite

      - name: Build DMG + ZIP
        # electron-builder.json 已经配 arm64 + x64 双架构 + dmg + zip,这里不用 --x64。
        # 不再 set -e,允许 DMG 失败但保留 ZIP 产物(常见 GitHub Actions macos-latest hdiutil bug)。
        run: |
          npm run build
          electron-builder --mac || echo "::warning::electron-builder exited non-zero (likely DMG hdiutil issue on GitHub Actions macos-latest);ZIP artifacts may still be present"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cc-manager-macos
          path: |
            release/CC Manager-*-mac-arm64.dmg
            release/CC Manager-*-mac-arm64.zip
            release/CC Manager-*-mac-x64.dmg
            release/CC Manager-*-mac-x64.zip
          if-no-files-found: warn  # macOS build is best-effort;unsigned + 真机未验证

      - name: Upload to GitHub release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/CC Manager-*-mac-arm64.dmg
            release/CC Manager-*-mac-arm64.zip
            release/CC Manager-*-mac-x64.dmg
            release/CC Manager-*-mac-x64.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}