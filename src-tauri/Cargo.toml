[package]
name = "cc-session-manager"
version = "4.0.0"
description = "Local manager for Claude Code session history"
authors = ["guoshaoran"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "cc-session-manager"  # v1.2 c3+ follow-up: pick default when `cargo run` has 2+ bin targets

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1"
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
notify = { version = "6", features = [] }
home = "0.5"
dirs = "5"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "time"] }
hmac = "0.12"      # v1.2 c3: cc-status-emit HMAC signing
sha2 = "0.10"      # v1.2 c3: SHA-256
hex = "0.4"        # v1.2 c3: signature hex encoding
axum = "0.7"       # v1.2 c4: HTTP receiver
getrandom = "0.3"  # v1.2 c4: 32-byte secret generation

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }  # v1.2 c4: pet::http tests use ServiceExt::oneshot

[[bin]]
name = "cc-status-emit"
path = "src/bin/cc-status-emit.rs"

[[test]]
name = "cc_status_emit_test"
path = "tests/cc_status_emit.rs"
